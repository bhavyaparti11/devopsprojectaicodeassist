<!DOCTYPE html>
<html>
<head>
    <title>AI Code Assist 💅</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #e3f2fd, #fce4ec);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 25px;
            width: 600px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 15px;
        }

        textarea {
            width: 100%;
            height: 140px;
            border-radius: 10px;
            border: 1px solid #ccc;
            padding: 10px;
            font-size: 14px;
            resize: none;
        }

        .buttons {
            text-align: center;
            margin-top: 10px;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .explain {
            background: #42a5f5;
            color: white;
        }

        .review {
            background: #ec407a;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        #output {
            margin-top: 15px;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 10px;
            min-height: 80px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>AI Code Assist 🚀</h1>

    <textarea id="code" placeholder="Paste your code here..."></textarea>

    <div class="buttons">
        <button class="explain" onclick="explainCode()">Explain Code</button>
        <button class="review" onclick="reviewCode()">Review Code</button>
    </div>

    <div id="output">Your result will appear here...</div>
</div>

<script>
async function explainCode() {
    const code = document.getElementById("code").value;

    const res = await fetch("http://localhost:3000/explain", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ code })
    });

    const data = await res.json();
    document.getElementById("output").innerText = data.explanation;
}

async function reviewCode() {
    const code = document.getElementById("code").value;

    const res = await fetch("http://localhost:3000/review", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ code })
    });

    const data = await res.json();
    document.getElementById("output").innerText = data.review;
}
</script>

</body>
</html>
